name: Build Quran Kareem APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "quran-icon.png"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare local website files
        run: |
          mkdir -p www
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .git/*|.github/*|android/*|node_modules/*) continue ;;
            esac
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done
          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sadman.qurankareem",
            "appName": "القرآن الكريم",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          if [ -f quran-icon.png ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android/app/src/main/res/mipmap-$density"
              case "$density" in
                mdpi) size=48 ;;
                hdpi) size=72 ;;
                xhdpi) size=96 ;;
                xxhdpi) size=144 ;;
                xxxhdpi) size=192 ;;
              esac
              mkdir -p "android/app/src/main/res/mipmap-$density"
              convert quran-icon.png -resize "${size}x${size}" -background white -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
              cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
              convert quran-icon.png -resize "${size}x${size}" -background white -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
            done
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi
          cat >> android/app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy.force(
                  "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
              )
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Kareem-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
